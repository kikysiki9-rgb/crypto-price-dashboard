<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Crypto Prices — GRAM / TON</title>
  <style>
    :root{color-scheme:dark;--bg:#0b0d12;--panel:#141821;--line:#252b38;--text:#f5f7fb;--muted:#8d96a8;--accent:#6c8cff;--accent2:#8a6cff;--good:#43d19a}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#202846 0,#0b0d12 46%);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
    main{max-width:620px;margin:auto;padding:24px 16px 40px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}h1{font-size:24px;margin:0;letter-spacing:-.5px}.sub{color:var(--muted);font-size:12px;margin-top:4px}.refresh{border:1px solid var(--line);background:#1a2030;color:var(--text);border-radius:10px;padding:10px 13px;cursor:pointer;font-weight:600}.refresh:active{transform:scale(.97)}
    .calculator,.coin{background:linear-gradient(145deg,#161b27,#11151d);border:1px solid var(--line);border-radius:17px;padding:17px;margin-bottom:14px;box-shadow:0 10px 30px #0003}.calculator h2{font-size:16px;margin:0 0 13px}.switch{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:13px}.switch button,.unit button{border:1px solid var(--line);background:#10141c;color:var(--muted);border-radius:9px;padding:10px 7px;cursor:pointer;font-size:12px}.switch button.active,.unit button.active{background:#28365f;color:#fff;border-color:#607be0}.inputrow{display:flex;gap:8px}.inputrow input{min-width:0;flex:1;background:#0c1017;color:#fff;border:1px solid #303949;border-radius:10px;padding:12px;font-size:18px;outline:none}.inputrow input:focus{border-color:var(--accent)}.unit{display:flex;gap:5px}.unit button{min-width:57px}.presets{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}.preset{background:#202738;border:1px solid #303a51;color:#cbd4ec;border-radius:8px;padding:7px 11px;cursor:pointer}.result{margin-top:13px;padding-top:12px;border-top:1px solid var(--line);color:var(--muted);line-height:1.65}.result strong{color:#fff;font-size:18px}.coin{position:relative}.coinhead{display:flex;align-items:center;gap:11px}.icon{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),var(--accent2));font-weight:800}.coin h2{margin:0;font-size:18px}.symbol{color:var(--muted);font-size:12px;text-transform:uppercase}.price{margin:18px 0 5px;font-size:27px;font-weight:750;letter-spacing:-.6px}.rub{font-size:15px;color:#c5ccda}.kopecks{color:var(--muted);font-size:13px;margin-top:3px}.change{position:absolute;right:17px;top:19px;font-size:12px;color:var(--good)}.negative{color:#ff7180}.status{text-align:center;color:var(--muted);font-size:12px;margin-top:16px}.error{color:#ff8995}@media(max-width:420px){.switch button{font-size:11px}.price{font-size:24px}}
  </style>
</head>
<body>
<main>
  <header class="top"><div><h1>Crypto prices</h1><div class="sub">GRAM и TON · CoinGecko</div></div><button class="refresh" id="refresh">Обновить цены</button></header>
  <section class="calculator">
    <h2 id="calcTitle">Посчитать стоимость X монет</h2>
    <div class="switch"><button class="active" data-mode="coins">Стоимость X монет</button><button data-mode="money">Сколько монет за X</button></div>
    <div class="inputrow"><input id="amount" type="number" min="0" step="any" value="1" inputmode="decimal" aria-label="Количество"><div class="unit"><button class="active" data-unit="kopecks">коп.</button><button data-unit="rubles">₽</button></div></div>
    <div class="presets"><button class="preset" data-value="0.01">0.01</button><button class="preset" data-value="0.1">0.1</button><button class="preset" data-value="1">1</button><button class="preset" data-value="10">10</button><button class="preset" data-value="100">100</button></div>
    <div class="result" id="result">Загрузка цен…</div>
  </section>
  <section class="coin"><div class="coinhead"><div class="icon">G</div><div><h2>GRAM</h2><div class="symbol">Gram</div></div></div><div class="change" id="gramChange">—</div><div class="price" id="gramUsd">—</div><div class="rub" id="gramRub">— ₽</div><div class="kopecks" id="gramKop">— копеек</div></section>
  <section class="coin"><div class="coinhead"><div class="icon">T</div><div><h2>TON</h2><div class="symbol">Toncoin</div></div></div><div class="change" id="tonChange">—</div><div class="price" id="tonUsd">—</div><div class="rub" id="tonRub">— ₽</div><div class="kopecks" id="tonKop">— копеек</div></section>
  <div class="status" id="status">Цены ещё не загружены</div>
</main>
<script>
const API='https://api.coingecko.com/api/v3/simple/price?ids=gram,toncoin&vs_currencies=usd,rub&include_24hr_change=true';
let prices={},mode='coins',unit='kopecks';
const $=id=>document.getElementById(id), fmt=(n,d=6)=>Number.isFinite(n)?n.toLocaleString('ru-RU',{minimumFractionDigits:d,maximumFractionDigits:d}):'—';
function show(id,value){$(id).textContent=value}
function render(){
  const g=prices.gram;if(!g)return; const raw=parseFloat($('amount').value)||0;
  let quantity, money; if(mode==='coins'){quantity=raw;money=raw*g.rub}else{money=unit==='kopecks'?raw/100:raw;quantity=money/g.rub}
  $('calcTitle').textContent=mode==='coins'?'Посчитать стоимость X монет':'Сколько монет я получу за X '+(unit==='kopecks'?'копеек':'рублей');
  $('result').innerHTML=mode==='coins'?`<strong>${fmt(quantity,quantity<1?6:2)} GRAM</strong> = ${fmt(money,2)} ₽ (${fmt(money*100,2)} коп.)`:`<strong>${fmt(quantity,quantity<1?6:2)} GRAM</strong> за ${fmt(money,2)} ₽`;
}
function card(key,prefix,name){let p=prices[key];if(!p)return;show(prefix+'Usd','$'+fmt(p.usd,6));show(prefix+'Rub',fmt(p.rub,2)+' ₽');show(prefix+'Kop',fmt(p.rub*100,2)+' копеек');let c=p.usd_24h_change;show(prefix+'Change',Number.isFinite(c)?(c>=0?'+':'')+fmt(c,2)+'%':'—');$(prefix+'Change').classList.toggle('negative',c<0)}
async function load(){ $('refresh').disabled=true;$('status').textContent='Обновление…';try{let r=await fetch(API);if(!r.ok)throw Error();prices=await r.json();card('gram','gram','GRAM');card('toncoin','ton','TON');render();$('status').textContent='Обновлено: '+new Date().toLocaleTimeString('ru-RU')}catch(e){$('status').textContent='Не удалось загрузить цены. Попробуйте ещё раз.';$('status').className='status error'}finally{$('refresh').disabled=false}}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));render()});document.querySelectorAll('[data-unit]').forEach(b=>b.onclick=()=>{unit=b.dataset.unit;document.querySelectorAll('[data-unit]').forEach(x=>x.classList.toggle('active',x===b));render()});document.querySelectorAll('.preset').forEach(b=>b.onclick=()=>{$('amount').value=b.dataset.value;render()});$('amount').oninput=render;$('refresh').onclick=load;load();
</script>
</body>
</html>
