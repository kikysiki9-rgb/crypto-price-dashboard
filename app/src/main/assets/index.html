<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GRAM · TON — цены</title><style>:root{color-scheme:dark;--bg:#0b0e14;--panel:#141923;--line:#252d3b;--text:#f4f7fb;--muted:#8d98aa;--accent:#64a5ff;--good:#73d6a3}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#182338 0,#0b0e14 45%);color:var(--text);font:16px system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}main{max-width:760px;margin:auto;padding:28px 16px 48px}h1{font-size:27px;margin:0 0 6px}h2{font-size:18px;margin:0 0 16px}.sub{color:var(--muted);margin:0 0 24px}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card,.calculator{background:rgba(20,25,35,.92);border:1px solid var(--line);border-radius:16px;padding:18px}.card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.coin{font-weight:700;font-size:19px}.badge{font-size:12px;color:var(--accent);background:#1a304d;border-radius:20px;padding:4px 8px}.price{font-size:25px;font-weight:700;letter-spacing:-.5px;word-break:break-all}.rub{color:var(--good);font-size:16px;margin-top:7px}.kopecks{color:var(--muted);font-size:13px;margin-top:3px}.updated{color:var(--muted);font-size:12px;margin-top:13px}.calculator{margin-top:18px}.modes{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.mode,.preset,.unit{border:1px solid var(--line);background:#10151f;color:var(--muted);border-radius:9px;padding:9px 11px;cursor:pointer}.mode.active,.unit.active{color:var(--text);border-color:var(--accent);background:#172943}.field{display:flex;gap:8px;margin-bottom:11px}.field input{min-width:0;flex:1;background:#0d121a;border:1px solid var(--line);border-radius:9px;color:var(--text);font-size:18px;padding:11px}.unit{white-space:nowrap}.presets{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}.preset{padding:7px 10px}.result{border-top:1px solid var(--line);padding-top:13px;color:var(--muted);line-height:1.6}.result strong{display:block;color:var(--text);font-size:20px}.actions{display:flex;align-items:center;gap:12px;margin-top:18px}.refresh{background:var(--accent);color:#07111f;border:0;border-radius:9px;padding:11px 17px;font-weight:700;cursor:pointer}.status{color:var(--muted);font-size:13px}@media(max-width:520px){.cards{grid-template-columns:1fr}main{padding-top:22px}}</style></head><body><main><h1>Цены GRAM и TON</h1><p class="sub">Точные котировки CoinGecko · USD и RUB</p><section class="cards"><article class="card"><div class="card-top"><span class="coin">GRAM</span><span class="badge">GRAM</span></div><div id="gramUsd" class="price">—</div><div id="gramRub" class="rub">— ₽</div><div id="gramKop" class="kopecks">— копеек</div><div id="gramTime" class="updated">Ожидание данных…</div></article><article class="card"><div class="card-top"><span class="coin">TON</span><span class="badge">TON</span></div><div id="tonUsd" class="price">—</div><div id="tonRub" class="rub">— ₽</div><div id="tonKop" class="kopecks">— копеек</div><div id="tonTime" class="updated">Ожидание данных…</div></article></section><section class="calculator"><h2>Калькулятор</h2><div class="modes"><button class="mode active" data-mode="coins">Стоимость X монет</button><button class="mode" data-mode="money">Монеты за X денег</button></div><div class="field"><input id="amount" type="number" min="0" step="any" value="1" inputmode="decimal"><button class="unit active" data-unit="rub">₽</button><button class="unit" data-unit="kop">коп.</button></div><div class="presets"><button class="preset" data-value="0.01">0.01</button><button class="preset" data-value="0.1">0.1</button><button class="preset" data-value="1">1</button><button class="preset" data-value="10">10</button><button class="preset" data-value="100">100</button></div><div class="field"><button class="unit active" id="coinGram">GRAM</button><button class="unit" id="coinTon">TON</button></div><div id="result" class="result">Введите количество монет.<strong>—</strong></div></section><div class="actions"><button class="refresh" id="refresh">Обновить цены</button><span class="status" id="status"></span></div></main><script>const $=id=>document.getElementById(id),prices={};let mode='coins',unit='rub',coin='gram';const fmt=(n,d=6)=>Number.isFinite(n)?n.toLocaleString('ru-RU',{minimumFractionDigits:0,maximumFractionDigits:d}):'—';function render(){const p=prices[coin],a=parseFloat($('amount').value)||0;if(!p){$('result').innerHTML='Нет данных о цене.<strong>—</strong>';return}if(mode==='coins'){const rub=p.rub*a;$('result').innerHTML=`${fmt(a,8)} ${coin.toUpperCase()} стоят:<strong>$${fmt(p.usd,8)} · ${fmt(rub,2)} ₽ (${fmt(rub*100,0)} коп.)</strong>`}else{const rub=unit==='kop'?a/100:a;const qty=rub/p.rub;$('result').innerHTML=`За ${fmt(a,4)} ${unit==='kop'?'копеек':'₽'} можно получить:<strong>${fmt(qty,8)} ${coin.toUpperCase()}</strong>`}}function setPrices(data){[['gram','gramUsd','gramRub','gramKop'],['toncoin','tonUsd','tonRub','tonKop']].forEach(([id,u,r,k])=>{const x=data[id];if(!x)return;prices[id==='gram'?'gram':'ton']={usd:x.usd,rub:x.rub};$(u).textContent='$'+fmt(x.usd,8);$(r).textContent=fmt(x.rub,6)+' ₽';$(k).textContent=fmt(x.rub*100,2)+' копеек за монету';$(id==='gram'?'gramTime':'tonTime').textContent='Обновлено: '+new Date().toLocaleTimeString('ru-RU')});render()}async function load(){$('status').textContent='Загрузка…';try{const r=await fetch('https://api.coingecko.com/api/v3/simple/price?ids=gram,toncoin&vs_currencies=usd,rub');if(!r.ok)throw Error('HTTP '+r.status);setPrices(await r.json());$('status').textContent='Готово'}catch(e){$('status').textContent='Не удалось обновить цены'}}document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('.mode').forEach(x=>x.classList.toggle('active',x===b));render()});document.querySelectorAll('.unit').forEach(b=>b.onclick=()=>{if(b.dataset.unit){unit=b.dataset.unit;document.querySelectorAll('.unit[data-unit]').forEach(x=>x.classList.toggle('active',x===b));render()}});document.querySelectorAll('.preset').forEach(b=>b.onclick=()=>{$('amount').value=b.dataset.value;render()});$('coinGram').onclick=()=>{coin='gram';$('coinGram').classList.add('active');$('coinTon').classList.remove('active');render()};$('coinTon').onclick=()=>{coin='ton';$('coinTon').classList.add('active');$('coinGram').classList.remove('active');render()};$('amount').oninput=render;$('refresh').onclick=load;load();</script></body></html>
